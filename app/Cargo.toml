[package]
name = "sessionbrain-app"
version = "0.5.0"
edition = "2021"
description = "SessionBrain: the hub and the window for live work maps of Claude Code sessions"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "time", "sync", "macros", "process", "signal", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "8", default-features = false }
wry = "0.53"
tao = "0.34"

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
